aid: illoca
name: illoca
description: 'illoca is an AI-native design engine built for professional architects and design studios,
  delivered through its product Tracing Paper. It helps architects move from early ideas to editable 2D
  and 3D designs with more speed and control, supporting sketches, redlines, prompts, floor plans, massing
  studies, iterative refinements, and exports for professional design workflows. Tracing Paper is built
  for controllable architectural ideation and iteration with editable outputs that hand off into BIM/CAD
  tools such as Autodesk Revit and Rhino. illoca is a portfolio company of bessemer-venture-partners
  (sector: ai-ml). As an application-first company it currently exposes a marketing site and web
  application rather than a public developer API.'
